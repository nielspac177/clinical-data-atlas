name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --locked --no-dev
          # Freeze the environment: `make site`'s `uv run python -m
          # atlas.sitebuild` would otherwise implicitly re-sync with
          # default flags (no --no-dev), which could pull the dev group
          # into what's supposed to be a prod-only deploy build.
          echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          make site BASE_URL="${PAGES_BASE_PATH}/" BUILD=${GITHUB_SHA::7}
          test -d _site && ! grep -rl -e '__BUILD__' -e '__BASE_URL__' -e '__SITE_URL__' -e '__UPDATED__' -e '__MAINTAINER__' -e '__REPO_URL__' --exclude-dir=vendor _site/

      - name: Size guard (< 900 MB)
        run: test "$(du -sm _site | cut -f1)" -lt 900

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Post-deploy smoke test
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --retry 10 --retry-delay 6 --retry-connrefused --retry-all-errors -fsSIL "$PAGE_URL" >/dev/null
          curl --retry 10 --retry-delay 6 --retry-connrefused --retry-all-errors -fsS "${PAGE_URL}data/stats.json" | python3 -c 'import sys, json; d = json.load(sys.stdin); assert d["record_count"] > 0, d'
