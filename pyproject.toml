[project]
name = "clinical-data-atlas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "markdown>=3.6",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
e2e = ["playwright>=1.45", "pytest-playwright>=0.5"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.pytest.ini_options]
markers = [
    "live: hits network",
    "e2e: browser",
]
addopts = "--strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas"]
