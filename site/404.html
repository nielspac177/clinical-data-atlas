<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Page not found — Clinical Data Atlas</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="__BASE_URL__assets/img/favicon.svg?v=__BUILD__" type="image/svg+xml" />
    <!-- Self-contained on purpose: GitHub Pages serves this file for any
         missing path, so relative stylesheet URLs would resolve against a
         directory that does not exist. Everything below is inline, and
         every link is absolute from __BASE_URL__. -->
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0d1117;
        --surface: #151a21;
        --text: #e8eef5;
        --muted: #9fb0c0;
        --accent: #63a0ff;
        --focus: #ffcc4d;
        --border: #232b35;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          color-scheme: light;
          --canvas: #f7f9fb;
          --surface: #ffffff;
          --text: #131a24;
          --muted: #55636f;
          --accent: #045fff;
          --focus: #7a3d00;
          --border: #dde3ea;
        }
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --canvas: #f7f9fb;
        --surface: #ffffff;
        --text: #131a24;
        --muted: #55636f;
        --accent: #045fff;
        --focus: #7a3d00;
        --border: #dde3ea;
      }
      * {
        box-sizing: border-box;
      }
      html {
        overflow-x: hidden;
      }
      body {
        display: grid;
        place-content: center;
        min-height: 100dvh;
        margin: 0;
        padding: 2rem 1.5rem;
        background: var(--canvas);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      main {
        max-width: 34rem;
      }
      .code {
        margin: 0 0 0.5rem;
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.25rem;
        line-height: 1.2;
        letter-spacing: -0.011em;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
        line-height: 1.65;
      }
      ul {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1.5rem 0 0;
        padding: 0;
        list-style: none;
      }
      a {
        color: var(--accent);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font-size: 0.8125rem;
        font-weight: 500;
        text-decoration: none;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("cda-theme");
          if (t === "dark" || t === "light") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>That page isn&rsquo;t in the atlas</h1>
      <p>
        The link may be old, or a dataset id may have changed shape between
        refreshes. The graph and the table both cover every record the atlas
        knows about &mdash; start from either.
      </p>
      <ul>
        <li><a class="btn" href="__BASE_URL__">Open the graph</a></li>
        <li><a class="btn" href="__BASE_URL__table.html">Browse the table</a></li>
        <li><a class="btn" href="__BASE_URL__about.html">About &amp; methods</a></li>
      </ul>
    </main>
  </body>
</html>
