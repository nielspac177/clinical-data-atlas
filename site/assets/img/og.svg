<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Clinical Data Atlas — a living catalog of open and gated clinical and neuroscience datasets">
  <defs>
    <radialGradient id="glow" cx="72%" cy="34%" r="58%">
      <stop offset="0%" stop-color="#63a0ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#63a0ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0d1117" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Decorative constellation: a backbone hub with domain-colored datasets. -->
  <g stroke="#e8eef5" stroke-opacity="0.16" stroke-width="1.5">
    <path d="M905 250 L800 168 M905 250 L1042 196 M905 250 L1010 348 M905 250 L806 356 M905 250 L928 128 M806 356 L742 430 M1010 348 L1078 424 M800 168 L706 214" />
  </g>
  <g>
    <circle cx="905" cy="250" r="26" fill="#63a0ff" />
    <circle cx="800" cy="168" r="12" fill="#2dd4bf" />
    <circle cx="1042" cy="196" r="11" fill="#f87171" />
    <circle cx="1010" cy="348" r="13" fill="#a78bfa" />
    <circle cx="806" cy="356" r="10" fill="#fb923c" />
    <circle cx="928" cy="128" r="9" fill="#4ade80" />
    <circle cx="742" cy="430" r="8" fill="#facc15" />
    <circle cx="1078" cy="424" r="8" fill="#e879f9" />
    <circle cx="706" cy="214" r="7" fill="#38bdf8" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(88, 92)">
    <g stroke="#63a0ff" stroke-width="3.4" stroke-linecap="round" fill="none">
      <path d="M22 11 L10 31" />
      <path d="M22 11 L34 31" />
      <path d="M10 31 L34 31" />
    </g>
    <g fill="#63a0ff">
      <circle cx="22" cy="11" r="6" />
      <circle cx="10" cy="31" r="5" />
      <circle cx="34" cy="31" r="5" />
    </g>
    <text x="56" y="32" fill="#e8eef5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="0.02em">CLINICAL DATA ATLAS</text>
  </g>

  <text x="88" y="290" fill="#e8eef5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-0.02em">A map of the clinical</text>
  <text x="88" y="366" fill="#e8eef5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-0.02em">data landscape</text>

  <text x="88" y="428" fill="#9fb0c0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27">Open and gated datasets, one schema, refreshed monthly.</text>

  <g transform="translate(88, 500)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21">
    <rect x="0" y="-24" width="196" height="38" rx="19" fill="#0e2a1c" />
    <text x="22" y="2" fill="#7ee2a8" font-weight="600">Metadata only</text>
    <rect x="216" y="-24" width="238" height="38" rx="19" fill="#10243d" />
    <text x="238" y="2" fill="#8ec5ff" font-weight="600">3D graph + table</text>
  </g>

  <rect x="0" y="622" width="1200" height="8" fill="#63a0ff" />
</svg>
